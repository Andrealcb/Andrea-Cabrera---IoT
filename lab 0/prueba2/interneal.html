<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oasis</title>
    <style>
         body {
            margin: 0;
            background-color: white;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
         }

         #contenedor {
            background-color: black;
            padding: 10px;

         }

         #logo {
        justify-content: center;
text-align: center;
border: 5px solid white;
background-color: black;

         }

    i
    {
        margin: 0;
        color: white;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 80px;
        text-align: center;
        text-transform: lowercase;
        font-weight: 900;
        letter-spacing: 5px;
    }
    </style>
</head>
<body>
    <div id="contenedor">
        <div id="logo">
            <i>OASIS</i>
        </div>
    </div>
</body>
</html>
